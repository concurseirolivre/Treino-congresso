<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ensaio Oral CBP 0393</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap"><style id="css">/* Layout: barra fixa no topo · trilho de slides à esquerda · card do slide no centro (vira lista horizontal no celular) */
:root{
  --bg:#F2F3F5; --surface:#FFFFFF; --ink:#1E2125; --muted:#5C636B; --line:#D9DCE0; --soft:#ECEEF1;
  --accent:#C8202B; --accent-ink:#FFFFFF; --accent-soft:#FBE4E5;
  --mark:#FFE27A; --mark-ink:#1E2125; --ok:#2E8549; --warn:#B26E14;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141619; --surface:#1D2024; --ink:#ECEEF0; --muted:#9BA2AA; --line:#33383E; --soft:#262A2F;
  --accent:#F0525B; --accent-ink:#1A0B0C; --accent-soft:#3A1D20;
  --mark:#7A6514; --mark-ink:#FFF6D6; --ok:#5DC27F; --warn:#E3A84A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141619; --surface:#1D2024; --ink:#ECEEF0; --muted:#9BA2AA; --line:#33383E; --soft:#262A2F;
  --accent:#F0525B; --accent-ink:#1A0B0C; --accent-soft:#3A1D20;
  --mark:#7A6514; --mark-ink:#FFF6D6; --ok:#5DC27F; --warn:#E3A84A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;
  padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.code{font-family:var(--f-mono);font-weight:700;font-size:13px;background:var(--accent);color:var(--accent-ink);padding:4px 8px;border-radius:6px;letter-spacing:.04em}
.name{font-weight:700;font-size:16px}
.sub{color:var(--muted);font-size:12.5px}
.run{display:flex;align-items:center;gap:12px;margin-left:auto}
.runclock{display:grid;grid-template-columns:auto auto;align-items:baseline;gap:2px 6px;min-width:150px}
.runclock .mono{font-size:20px;font-weight:700}
.runclock .of{color:var(--muted);font-size:12px}
.runclock .bar{grid-column:1/-1}
.save{display:flex;align-items:center;gap:10px}
.status{color:var(--muted);font-size:12.5px}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 11px;font-size:13px}
.btn.pulse{box-shadow:0 0 0 3px var(--accent-soft)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;text-decoration:underline}

.bar{height:5px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s linear}
.bar i.warn{background:var(--warn)} .bar i.over{background:var(--accent)}
.warn{color:var(--warn)} .over{color:var(--accent)} .ok{color:var(--ok)}

/* layout */
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;max-width:1180px;margin:0 auto;padding:20px}
.rail{position:sticky;top:84px;align-self:start;max-height:calc(100vh - 100px);overflow:auto}
.railhead{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 8px 8px}
.railhead .mono{text-transform:none;letter-spacing:0}
.rail ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rail button{width:100%;display:grid;grid-template-columns:28px minmax(0,1fr) auto;grid-template-areas:"n t tm" "n last lap";align-items:center;gap:0 8px;text-align:left;
  border:0;background:transparent;padding:7px 8px;border-radius:8px;cursor:pointer}
.rail button:hover{background:var(--soft)}
.rail button.on{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.rail .num{grid-area:n;font-family:var(--f-mono);font-weight:700;font-size:13px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--soft)}
.rail button.on .num{background:var(--accent);color:var(--accent-ink)}
.rail .tt{grid-area:t;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail .tm{grid-area:tm;font-size:12px;color:var(--muted)}
.rail .tm.over{color:var(--accent)}
.rail .last{grid-area:last;font-size:11.5px;color:var(--muted)}
.rail .last::before{content:"último "}
.rail .lap{grid-area:lap;font-size:11.5px;color:var(--ok)}
.dot{font-style:normal;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:50%;display:inline-grid;place-items:center;width:15px;height:15px;font-size:10px;vertical-align:1px}

/* card */
.main{min-width:0;display:grid;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 28px;display:grid;gap:18px;min-width:0}
.cardhead{display:flex;gap:16px;align-items:center}
.bignum{font-family:var(--f-mono);font-weight:700;font-size:30px;color:var(--accent-ink);background:var(--accent);width:56px;height:56px;border-radius:12px;display:grid;place-items:center;flex:none}
.ct{min-width:0}
.ct h1{margin:0;font-size:26px;line-height:1.15;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:13px;margin-top:4px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.seg{display:inline-flex;background:var(--soft);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tools{display:flex;gap:6px;flex-wrap:wrap}

.anchors{background:var(--soft);border-radius:10px;padding:12px 16px}
.anchors .lbl{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.anchors ol{margin:0;padding-left:22px;display:grid;gap:4px;font-weight:600}
.anchors ol li::marker{color:var(--accent);font-family:var(--f-mono)}
.anchors .editing .a{outline:1px dashed var(--line);padding:0 4px;border-radius:4px}
.anchors .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;margin-left:6px}
.add{border:1px dashed var(--line);background:transparent;border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px;justify-self:start}
.nat{margin:0;color:var(--muted);font-size:13.5px;font-style:italic}
.hint{margin:0;font-size:13.5px;color:var(--muted);background:var(--soft);padding:8px 12px;border-radius:8px}

.fala{font-family:var(--f-read);font-size:19px;line-height:1.62;max-width:68ch;display:grid;gap:12px}
.fala p{margin:0;border-radius:6px;transition:filter .2s}
.fala.editing p{outline:1px dashed var(--line);padding:4px 8px;min-height:1.6em}
.fala.editing p:focus{outline:2px solid var(--accent)}
.fala mark{background:var(--mark);color:var(--mark-ink);padding:0 2px;border-radius:3px}
.fala.mode-ancoras p.veiled{filter:blur(6px);user-select:none;cursor:pointer}
.fala.mode-ancoras p{cursor:pointer}
.fala.mode-lacunas mark{color:transparent;background:transparent;border-bottom:2px dotted var(--accent);cursor:pointer}
.fala.mode-lacunas mark.shown{color:var(--mark-ink);background:var(--mark);border-bottom-color:transparent}
.curta{background:var(--soft);border-radius:10px;padding:10px 14px}
.curta summary{cursor:pointer;font-weight:600}
.curta p{font-family:var(--f-read);margin:8px 0 0}
.aviso{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:14px}
.aviso b{color:var(--accent)}
.aviso span{flex:1 1 300px;min-width:0}
.notes{display:grid;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.notes textarea{font:inherit;font-weight:400;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical;width:100%}

.foot{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;border-top:1px solid var(--line);padding-top:16px}
.stopwatch{display:grid;grid-template-columns:auto 1fr;align-items:baseline;gap:4px 10px;max-width:320px;justify-self:center;width:100%}
.stopwatch .big{font-size:30px;font-weight:700}
.stopwatch .of{color:var(--muted);font-size:12.5px}
.stopwatch .bar{grid-column:1/-1}
.swbtns{grid-column:1/-1;display:flex;gap:6px;justify-content:center}
.keys{margin:0;color:var(--muted);font-size:12px}

/* results */
.results{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 26px;display:grid;gap:12px;min-width:0}
.reshead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.results h2{margin:0;font-size:20px}
.results h3{margin:8px 0 0;font-size:15px}
.total{font-size:30px;font-weight:700}
.rescap{margin:0;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:4px;max-width:340px}
.hist li{display:flex;justify-content:space-between}
.results .btn{justify-self:start}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;max-width:min(92vw,520px);transition:opacity .2s,transform .2s;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr);padding:14px 16px;gap:14px}
  .rail{position:static;max-height:none;overflow-x:auto}
  .railhead{display:none}
  .rail ol{display:flex;gap:6px}
  .rail button{display:flex;gap:6px;padding:6px 10px;background:var(--surface);box-shadow:0 0 0 1px var(--line);white-space:nowrap}
  .rail .tt{max-width:140px}
  .rail .tm,.rail .last,.rail .lap{display:none}
  .card{padding:18px 16px}
  .fala{font-size:17.5px}
  .foot{grid-template-columns:1fr 1fr}
  .stopwatch{grid-column:1/-1;grid-row:1}
  .run{margin-left:0}
  .top{padding:10px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style><div id="app"></div><script type="application/json" id="state">{"savedAt": 0, "slides": [{"n": 2, "t": "Título", "alvo": 20, "ancoras": ["Título do trabalho", "Pergunta central: quão bem a IA identifica quem está em maior risco?"], "fala": ["Hoje vou apresentar o trabalho “Predição de risco suicida por inteligência artificial: metanálise de modelos de Machine Learning e Processamento de Linguagem Natural”.", "A pergunta central desse trabalho foi: quão bem a IA identifica quem está em maior risco de comportamento suicida?"], "nat": "", "aviso": "", "curta": "", "notas": "", "ultimo": 0}, {"n": 3, "t": "O problema", "alvo": 50, "ancoras": ["720 mil/ano · 3ª causa (15–29 anos)", "2017: 365 estudos, 50 anos → pouco melhor que o acaso", "Cada fator sozinho diz pouco", "IA combina dezenas de informações", "“Isso funciona de verdade?”"], "fala": ["Primeiro, dando uma dimensão do problema. Todo ano morrem em média mais de 720 mil pessoas em decorrência do suicídio, e é a terceira causa de morte entre jovens de 15 a 29 anos. E o grande problema é: a gente prevê muito mal. Um grande estudo de 2017 juntou 365 pesquisas, publicadas ao longo de 50 anos, e mostrou que os fatores de risco que todos nós aprendemos — depressão, tentativa prévia, desesperança — têm uma predição apenas ligeiramente melhor que o acaso.", "Por quê? Porque cada fator isoladamente é muito pouco quando falamos de predição.", "A inteligência artificial propõe olhar dezenas de informações ao mesmo tempo e enxergar combinações que a gente não enxerga.", "A pergunta é: isso funciona de verdade?"], "nat": "", "aviso": "", "curta": "", "notas": "", "ultimo": 0}, {"n": 4, "t": "Pergunta PICO e objetivo", "alvo": 35, "ancoras": ["Metanálise · critérios pela PICO", "P: risco clínico ou monitorados digitalmente", "I: ML e NLP", "C: avaliação clínica (Beck)", "O: tentativa ou ideação em seguimento"], "fala": ["Para responder a essa pergunta, conduzimos uma metanálise. Os critérios de elegibilidade foram definidos pela estratégia PICO.", "A população compreendeu indivíduos em risco clínico ou da população geral monitorados digitalmente; a intervenção, modelos de inteligência artificial, de machine learning e de processamento de linguagem natural; a comparação, a avaliação clínica convencional, como as escalas de Beck; e o desfecho, tentativa ou ideação suicida confirmada em seguimento."], "nat": "", "aviso": "", "curta": "", "notas": "", "ultimo": 0}, {"n": 5, "t": "Os modelos de IA", "alvo": 65, "ancoras": ["Dados do paciente → padrões do desfecho", "Regressão: soma ponderada (escore)", "Árvores: perguntas em sequência (RF, boosting)", "SVM: fronteira entre os grupos", "Redes neurais: camadas, menos interpretáveis", "NLP: texto → números · comum a todos: escore → AUC"], "fala": ["Os estudos incluídos utilizaram diferentes tipos de modelos de inteligência artificial.", "De maneira geral, esses modelos recebem informações dos pacientes — como dados sociodemográficos, sintomas, diagnósticos, histórico de tentativas e, em alguns estudos, textos de prontuários ou publicações em redes sociais — e procuram padrões associados ao desfecho suicida.", "Podemos dividir esses modelos em 4 famílias.", "A primeira família são os modelos de regressão: eles estimam a probabilidade do desfecho a partir da soma ponderada das variáveis avaliadas. A regressão dá um peso a cada fator de risco e soma tudo, como um escore clínico.", "Outra família são os modelos de árvores de decisão, como Random Forest e métodos de boosting. Uma árvore funciona por meio de uma sequência de perguntas: por exemplo, se o paciente apresentou ideação suicida, se possui tentativa anterior ou determinado nível de sintomas. Cada resposta direciona o paciente para um novo ramo, até o modelo chegar a uma estimativa de risco.", "Alguns estudos utilizaram máquinas de vetores de suporte, ou SVM. Esse modelo procura encontrar uma fronteira matemática que separe, da melhor forma possível, indivíduos com e sem o desfecho.", "Também foram utilizadas redes neurais. Elas possuem várias camadas de processamento e conseguem identificar relações mais complexas entre as variáveis. Entretanto, geralmente necessitam de maior quantidade de dados e apresentam menor interpretabilidade.", "Nos estudos que analisaram textos, foram empregadas técnicas de processamento de linguagem natural. O texto era convertido em uma representação numérica para que o modelo pudesse reconhecer padrões linguísticos associados ao risco, como determinadas palavras, expressões ou relações entre termos.", "Portanto, o que muda entre os modelos é a maneira como eles aprendem os padrões. O objetivo comum é produzir um escore que permita discriminar indivíduos com e sem o desfecho, e essa capacidade discriminativa foi avaliada principalmente pela AUC."], "nat": "", "aviso": "", "curta": "", "notas": "", "ultimo": 0}, {"n": 6, "t": "Seleção dos estudos (PRISMA)", "alvo": 30, "ancoras": ["PRISMA", "48 registros → fora do período", "Triagem → 20 lidos na íntegra", "11 saem (o mais comum: sem AUC)", "9 estudos"], "fala": ["Como chegamos aos estudos? Seguindo um protocolo padrão, o PRISMA. Partimos de 48 registros. Depois de tirar os que estavam fora do período e fazer a triagem pelo título e resumo, sobraram 20 para ler na íntegra. Desses, onze saíram — o motivo mais comum foi não informar a medida de acerto que a gente precisava. No fim, nove estudos, com mais de 100 mil pessoas."], "nat": "", "aviso": "“Mais de 100 mil pessoas” não bate com o resumo submetido (“mais de 40 mil”) nem com o slide (“N > 40 mil”). Escolha um número e use o mesmo na fala e no slide.", "curta": "", "notas": "", "ultimo": 0}, {"n": 7, "t": "Por que a AUC", "alvo": 35, "ancoras": ["Área sob a curva ROC", "Diferencia quem teve de quem não teve", "Todos os pontos de corte → compara estudos", "0,5 acaso → 1 perfeito", "Nossa AUC: 0,869 = boa"], "fala": ["A AUC representa a área sob a curva ROC e mede a capacidade do modelo de diferenciar pessoas que apresentaram o desfecho daquelas que não apresentaram. Ela foi escolhida porque resume o desempenho considerando todos os possíveis pontos de corte, permitindo comparar estudos que utilizaram limiares diferentes.", "Seu valor varia de 0,5, que corresponde a uma discriminação ao acaso, até 1, que representa discriminação perfeita. Em nosso estudo, a AUC combinada foi de 0,869, indicando boa capacidade discriminativa."], "nat": "", "aviso": "", "curta": "", "notas": "", "ultimo": 0}, {"n": 8, "t": "Escolhas estatísticas", "alvo": 45, "ancoras": ["1. Efeitos aleatórios: cada estudo, sua realidade", "2. REML: mais confiável com poucos estudos", "3. I² (parte real) + τ² (tamanho)", "4. Egger: estudos “na gaveta”"], "fala": ["Em relação às escolhas estatísticas:", "Primeiro, usamos um modelo de efeitos aleatórios. Esse modelo aceita que cada estudo tem a sua realidade e calcula a média levando isso em conta.", "Segundo, um detalhe técnico: o método de cálculo, chamado REML, é o mais confiável quando temos poucos estudos. Terceiro, medimos a heterogeneidade com duas medidas: o I², que diz que parte da diferença é real e não acaso, e o tau-quadrado, que diz o tamanho dessa diferença. E, por último, o teste de Egger, que procura sinais de que só os estudos com resultado bom foram publicados."], "nat": "", "aviso": "", "curta": "", "notas": "", "ultimo": 0}, {"n": 9, "t": "Decisões metodológicas", "alvo": 40, "ancoras": ["Sem subgrupos: 2–3 estudos por grupo = sorte", "Robustez: tira um estudo por vez", "AUC sempre entre 0,86 e 0,87"], "fala": ["Tomamos duas decisões que vale explicar. Não dividimos os estudos em subgrupos — por tipo de modelo, por exemplo. Com nove estudos, cada grupo teria dois ou três, e qualquer diferença poderia ser pura sorte. Em vez disso, fizemos um teste de robustez: tiramos um estudo de cada vez e refizemos a conta, para ver se algum deles sozinho estava puxando o resultado. Não estava: a AUC ficou sempre entre zero vírgula oitenta e seis e zero vírgula oitenta e sete."], "nat": "", "aviso": "", "curta": "", "notas": "", "ultimo": 0}, {"n": 10, "t": "Resultado principal", "alvo": 50, "ancoras": ["Cada linha = um estudo · losango = combinado", "AUC 0,87 → 87 de cada 100 pares", "Fatores tradicionais ≈ moeda", "Todos entre 0,82 e 0,91, incerteza estreita"], "fala": ["E aqui está o resultado. Cada linha é um estudo, e o losango vermelho embaixo é o resultado combinado: uma AUC de zero vírgula oitenta e sete. Voltando ao exemplo das duas pessoas: em oitenta e sete de cada cem pares, o modelo acerta quem está em maior risco. Lembrem que os fatores de risco tradicionais ficavam pouco acima da moeda. E reparem que nenhum dos nove estudos ficou perto do acaso — todos entre zero vírgula oitenta e dois e zero vírgula noventa e um, com uma margem de incerteza estreita."], "nat": "Forest plot dos 9 estudos + losango combinado; destaque 0,87 (IC 95% 0,847 a 0,891) e “87 de cada 100 pares”.", "aviso": "“Voltando ao exemplo das duas pessoas”: esse exemplo não aparece mais na sua fala do slide 7. Ou acrescente lá uma frase (“pegue duas pessoas, uma que teve o desfecho e uma que não teve: a AUC é a chance de o modelo dar o risco maior à pessoa certa”), ou troque aqui por “Na prática:”.", "curta": "", "notas": "", "ultimo": 0}, {"n": 11, "t": "Heterogeneidade", "alvo": 55, "ancoras": ["I² 72% → parece muita discordância", "τ² minúsculo: ~0,03 de AUC", "Balança: 3 g em 1 kg", "Estudos precisos (Suécia) inflam o I²", "Estatística, não clínica", "Novo contexto: 0,81 a 0,92"], "fala": ["Agora, um ponto que confunde muita gente. O I² deu setenta e dois por cento — o que pareceria muita discordância entre os estudos. Mas o tau-quadrado, que mede o tamanho real da diferença, foi minúsculo: uns três centésimos de AUC. Como os dois podem discordar? Pensem numa balança de laboratório: ela mostra que dois pacotes de um quilo diferem em três gramas — a diferença é real, mas na cozinha não muda nada. Com estudos muito grandes e precisos, como     commitPara(p);
  }
  function commitPara(p) { cur().fala[+p.dataset.pk] = sanitize(p.innerHTML); changed(); renderCard(); }

  function setMode(m) { ui.mode = m; ui.revealed = {}; if (m !== "texto") ui.edit = false; renderCard(); }

  // ---------- navigation ----------
  function go(k) {
    if (k < 0 || k >= state.slides.length || k === ui.i) return;
    if (run.running) { var now = Date.now(); run.laps[cur().n] = (run.laps[cur().n] || 0) + (now - run.slideStart) / 1000; run.slideStart = now; }
    stopSW(true); timer.acc = 0;
    ui.i = k; ui.revealed = {};
    renderRail(); renderCard();
    window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }

  // ---------- slide stopwatch ----------
  function swElapsed() { return timer.acc + (timer.running ? (Date.now() - timer.start) / 1000 : 0); }
  function toggleSW() { if (timer.running) stopSW(false); else { timer.running = true; timer.start = Date.now(); } renderSW(); }
  function stopSW(silent) {
    if (!timer.running) return;
    timer.acc = swElapsed(); timer.running = false;
    if (timer.acc >= 3) { cur().ultimo = Math.round(timer.acc); changed(); }
    if (!silent) renderSW();
  }
  function resetSW() { timer.running = false; timer.acc = 0; renderSW(); }
  function renderSW() {
    var t = $("#swTime"), b = $("#swBar"), g = $("#swGo"); if (!t) return;
    var e = swElapsed(), a = cur().alvo;
    t.textContent = fmt(e);
    t.className = "mono big" + (e > a * 1.15 ? " over" : e > a ? " warn" : "");
    b.style.width = Math.min(100, e / a * 100) + "%";
    b.className = e > a * 1.15 ? "over" : e > a ? "warn" : "";
    g.textContent = timer.running ? "Pausar" : (e > 0 ? "Continuar" : "Cronometrar");
  }

  // ---------- full run ----------
  $("#runBtn").addEventListener("click", function () { if (run.running) endRun(); else startRun(); });
  function startRun() {
    run = { running: true, start: Date.now(), slideStart: Date.now(), laps: {}, result: null };
    $("#results").hidden = true;
    if (ui.i !== 0) { ui.i = 0; }
    ui.mode = "ancoras"; ui.edit = false; ui.revealed = {};
    $("#runBtn").textContent = "Encerrar ensaio"; $("#runBtn").classList.add("primary"); $("#runBtn").classList.remove("ghost");
    $("#runclock").hidden = false;
    renderRail(); renderCard();
    toast("Ensaio iniciado no modo Só âncoras. Use → para avançar.");
  }
  function endRun() {
    var now = Date.now();
    run.laps[cur().n] = (run.laps[cur().n] || 0) + (now - run.slideStart) / 1000;
    var total = (now - run.start) / 1000;
    run.running = false;
    var laps = {}; Object.keys(run.laps).forEach(function (k) { laps[k] = Math.round(run.laps[k]); });
    state.runs = (state.runs || []); state.runs.unshift({ data: new Date().toISOString(), total: Math.round(total), laps: laps });
    state.runs = state.runs.slice(0, 8);
    changed();
    $("#runBtn").textContent = "Iniciar ensaio completo"; $("#runBtn").classList.remove("primary"); $("#runBtn").classList.add("ghost");
    $("#runclock").hidden = true;
    showResults(state.runs[0]);
    run.laps = {};
    renderRail();
  }
  function showResults(r) {
    var box = $("#results"); box.hidden = false;
    var rows = state.slides.map(function (s) {
      var t = r.laps[s.n] || 0, d = t - s.alvo;
      return '<tr><td>' + s.n + '</td><td>' + esc(s.t) + '</td><td class="mono">' + fmt(s.alvo) + '</td><td class="mono">' + (t ? fmt(t) : "—") + '</td><td class="mono ' + (t && d > s.alvo * 0.15 ? "over" : "") + '">' + (t ? (d >= 0 ? "+" : "−") + fmt(Math.abs(d)) : "") + '</td></tr>';
    }).join('');
    var hist = (state.runs || []).map(function (x) { var dt = new Date(x.data); return '<li><span>' + dt.toLocaleDateString("pt-BR") + ' ' + dt.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) + '</span><span class="mono ' + (x.total > LIMIT ? "over" : x.total > 570 ? "warn" : "ok") + '">' + fmt(x.total) + '</span></li>'; }).join('');
    box.innerHTML = '<div class="reshead"><h2>Resultado do ensaio</h2><span class="mono total ' + (r.total > LIMIT ? "over" : r.total > 570 ? "warn" : "ok") + '">' + fmt(r.total) + '</span></div>' +
      '<p class="rescap">' + (r.total > LIMIT ? "Passou dos 10 minutos. Corte primeiro nos slides com maior diferença." : r.total > 570 ? "Dentro do limite, mas com menos de 30 s de folga." : "Dentro do limite, com folga.") + '</p>' +
      '<div class="tablewrap"><table><thead><tr><th>Slide</th><th>Tema</th><th>Alvo</th><th>Tempo</th><th>Diferença</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<h3>Ensaios anteriores</h3><ul class="hist">' + hist + '</ul>' +
      '<button type="button" class="btn ghost small" id="closeRes">Fechar</button>';
    box.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  $("#results").addEventListener("click", function (e) { if (e.target.id === "closeRes") $("#results").hidden = true; });

  setInterval(function () {
    if (timer.running) renderSW();
    if (run.running) {
      var e = (Date.now() - run.start) / 1000;
      $("#runTime").textContent = fmt(e);
      var b = $("#runBar"); b.style.width = Math.min(100, e / LIMIT * 100) + "%";
      b.className = e > LIMIT ? "over" : e > 570 ? "warn" : "";
      $("#runTime").className = "mono " + b.className;
    }
  }, 250);

  // ---------- keyboard ----------
  document.addEventListener("keydown", function (e) {
    if (e.target.closest("[contenteditable], textarea, input") || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "ArrowRight") { e.preventDefault(); go(ui.i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(ui.i - 1); }
    else if (e.key === " ") { e.preventDefault(); toggleSW(); }
    else if (e.key === "1") setMode("texto");
    else if (e.key === "2") setMode("ancoras");
    else if (e.key === "3") setMode("lacunas");
    else if (e.key === "e" || e.key === "E") { ui.edit = !ui.edit; if (ui.edit) ui.mode = "texto"; renderCard(); }
  });

  // ---------- save ----------
  var toastT;
  function toast(msg) {
    var t = $("#toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
    t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove("on"); }, 3200);
  }
  function renderStatus() {
    var st = $("#status"), b = $("#saveBtn");
    if (ui.readOnly) { st.textContent = "Visualização somente leitura"; b.hidden = true; return; }
    if (ui.artifact === null) { st.textContent = ui.dirty ? "Alterações guardadas só neste navegador" : ""; b.disabled = true; b.textContent = "Salvar indisponível aqui"; return; }
    st.textContent = ui.dirty ? (restoredDraft ? "Rascunho recuperado · não salvo" : "Alterações não salvas") : "Tudo salvo";
    b.disabled = !ui.dirty || ui.artifact === undefined;
    b.classList.toggle("pulse", ui.dirty);
  }
  function jsonForEmbed(o) { return JSON.stringify(o).replace(/</g, "\\u003c"); }
  function buildDoc() {
    var css = document.getElementById("css").textContent;
    var js = document.getElementById("appjs").textContent;
    return SKEL_HEAD + TITLE + FONTS + '<style id="css">' + css + '</style><div id="app"></div>' +
      '<script type="application/json" id="state">' + jsonForEmbed(state) + '<\/script>' +
      '<script id="appjs">' + js + '<\/script></body></html>';
  }
  $("#saveBtn").addEventListener("click", function () {
    if (!ui.artifact || !ui.dirty) return;
    stopSW(true);
    state.savedAt = Date.now();
    var b = $("#saveBtn"); b.disabled = true; b.textContent = "Salvando…";
    ui.artifact.publish(buildDoc()).then(function () {
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
      $("#status").textContent = "Salvo. Recarregando…";
    }).catch(function (err) {
      var code = err && err.code;
      b.textContent = "Salvar alterações";
      if (code === "conflict") { toast("Havia uma versão mais nova. A página vai recarregar; seu rascunho continua neste navegador."); return; }
      if (code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "not_declared" || code === "capability_disabled" || code === "capability_removed") { ui.artifact = null; renderStatus(); toast("Esta visualização não pode salvar. As alterações ficam só neste navegador."); return; }
      if (code === "rate_limited") { toast("Muitos salvamentos seguidos. Espere um pouco e tente de novo."); }
      else toast("Não foi possível salvar agora. Suas alterações continuam neste navegador.");
      b.disabled = false;
    });
  });

  // ---------- boot ----------
  renderRail(); renderCard(); renderStatus();
  if (restoredDraft) toast("Recuperei alterações que você não tinha salvado.");
  (function tryUse(n) {
    if (window.claude && window.claude.use) {
      window.claude.use("artifact").then(function (a) { ui.artifact = a; renderStatus(); }).catch(function () { ui.artifact = null; renderStatus(); });
    } else if (n < 40) setTimeout(function () { tryUse(n + 1); }, 250);
    else { ui.artifact = null; renderStatus(); }
  })(0);
})();
</script>
</body></html>
